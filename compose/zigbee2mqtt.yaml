---
services:
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt:2.5.1
    restart: unless-stopped
    # Zigbee coordinator dongle. Pinned by stable by-id path so it survives
    # re-enumeration across reboots.
    devices:
    - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_480a12b4486dee1183c6d719860a09de-if00-port0:/dev/ttyUSB0
    ports:
    - 8080:8080
    # Generated by bin/apply from compose/env/zigbee2mqtt.secrets.map via bws.
    # Never committed. Optional here (z2m has no required secret today) but wired
    # for consistency and future secret needs (e.g. MQTT credentials moved in).
    env_file:
    - /etc/homelab-pi/zigbee2mqtt.env
    volumes:
    - /opt/zigbee2mqtt/data:/app/data
    - /run/udev:/run/udev:ro
