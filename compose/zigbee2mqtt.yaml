---
# Service definition only — hardware-free, so this file runs identically on the
# Pi and in CI. The Zigbee coordinator dongle passthrough lives in
# compose/hardware.yaml (applied via COMPOSE_FILE on the Pi only).
services:
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt:2.5.1@sha256:1e639d3144960f246dcecc21d993169fd6844b5817e939bca498b2abf2c23159
    restart: unless-stopped
    ports:
    - 8080:8080
    # Generated by bin/apply from compose/env/zigbee2mqtt.secrets.map via bws.
    # Never committed. Optional here (z2m has no required secret today) but wired
    # for consistency and future secret needs (e.g. MQTT credentials moved in).
    env_file:
    - ${HL_ENV_DIR:-/etc/homelab-pi}/zigbee2mqtt.env
    volumes:
    - ${HL_DATA_ROOT:-/opt}/zigbee2mqtt/data:/app/data
