# mise-managed toolchain. `mise install` on the Pi and on your workstation.
#
# Runtime CLIs are needed on the Pi; lint tools are needed wherever you commit
# (workstation) and in CI. Installing the superset everywhere keeps it simple.

[tools]
# --- runtime (Pi) ---
bitwarden-secrets-manager = "2.1.0"
restic = "0.19.1"
jq = "1.8.2"

[settings]
# Pin versions after first install with `mise pin` for reproducibility; kept as
# "latest" here so the initial bootstrap resolves current releases. Renovate can
# manage mise.toml pins once you pin them.
idiomatic_version_file_enable_tools = []
