---
# Single Compose project composed from one file per app.
#
# `include:` (Compose >= 2.20) merges each self-contained file into ONE project,
# so `docker compose up -d` from the repo root brings the whole stack up, while
# `docker compose stop zigbee2mqtt` still targets a single service.
#
# Adding an app = drop a file in compose/ and add one line below. No script or
# unit changes required.
#
# These base files are HARDWARE-FREE and form a complete, runnable stack on
# their own (this is what CI runs). On the Pi, the hardware overlay
# (compose/hardware.yaml) is layered additively via COMPOSE_FILE — set by
# bin/bootstrap — to add dongle passthrough, host networking, and D-Bus access.
# compose/hardware.yaml is intentionally NOT in this include: it must be absent
# in CI, present only on the Pi.
include:
- compose/zigbee2mqtt.yaml
- compose/zwave-js-ui.yaml
# - compose/theengsgateway.yaml
